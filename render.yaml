# Free-tier Blueprint: Render Web Service for VigilAI API
# Deploy: https://dashboard.render.com/select-repo?type=blueprint
# Or connect GitHub → New → Blueprint → this file
#
# Notes:
# - Free instances sleep after ~15 min idle (cold start 30–60s)
# - DATABASE_URL: prefer Supabase pooler (port 6543) or Render Postgres.
#   Neon free egress is easy to blow with FAERS stream-ingest — see docs/CUTOVER_SUPABASE.md

services:
  - type: web
    name: vigil-ai-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # Supabase pooler URI (or Render Postgres) — set in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@vigilai.dev
      - key: SEED_ADMIN_PASSWORD
        value: admin123
      - key: USE_TRANSFORMER_NER
        value: "false"
      - key: USE_PRESIDIO
        value: "false"
      - key: USE_ONLINE_TRANSLATION
        value: "true"
      - key: USE_LLM
        value: "true"
      - key: USE_RXNORM
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AUTO_SEED_DEMO
        value: "true"
      # Optional Pathfinder SaaS search (set in Render dashboard / API — never commit)
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
